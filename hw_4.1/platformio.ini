[platformio]
default_envs = esp32s3

[extra]
uart_speed = 115200

[env]
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -DUART_SPEED=${extra.uart_speed}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${extra.uart_speed}
build_src_filter = +<esp32/> -<stm32/>

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = ${extra.uart_speed}
build_src_filter = +<stm32/> -<esp32/>
