[platformio]
default_envs = esp32s3

[extra]
uart_speed = 115200

[env]
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Werror
    -DUART_SPEED=${extra.uart_speed}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${extra.uart_speed}
